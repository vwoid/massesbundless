function saveCustomMessage(){const text=document.getElementById('editor-text').value.trim();if(!text)return toast('Message is empty');const model=document.getElementById('editor-model').value,type=document.getElementById('editor-type').value,tags=document.getElementById('editor-tags').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);state.customMessages.push({id:'c'+Date.now().toString(36),text,model,type,tags});saveState();closeModal('message-modal');currentMessageTab=model;renderMessages();toast('Message saved')}
function deleteCustom(id){state.customMessages=state.customMessages.filter(x=>x.id!==id);saveState();renderMessages()}
function renderStats(){const hist=state.history,weekAgo=Date.now()-7*864e5,monthAgo=Date.now()-30*864e5;const week=hist.filter(x=>x.id>=weekAgo).reduce((s,x)=>s+x.total,0),month=hist.filter(x=>x.id>=monthAgo).reduce((s,x)=>s+x.total,0);let modelTotals={};MODELS.forEach(n=>modelTotals[n]=+state.earnings[n]||0);hist.slice(0,30).forEach(h=>MODELS.forEach(n=>modelTotals[n]+=+(h.earnings?.[n]||0)));const max=Math.max(1,...Object.values(modelTotals)),best=Object.entries(modelTotals).sort((a,b)=>b[1]-a[1])[0];document.getElementById('stats-content').innerHTML=`<div class="grid4"><div class="stat"><span class="label">Current shift</span><div class="num">${money(totalNet())}</div></div><div class="stat"><span class="label">7 days</span><div class="num">${money(week)}</div></div><div class="stat"><span class="label">30 days</span><div class="num">${money(month)}</div></div><div class="stat"><span class="label">Best model</span><div class="num" style="font-size:1rem">${best?.[0]||'-'}</div><span class="muted">${money(best?.[1]||0)}</span></div></div><div class="card" style="margin-top:16px"><span class="model-name">Earnings by model</span>${Object.entries(modelTotals).map(([n,v])=>`<div class="bar-row"><span>${n}</span><div class="bar"><div style="width:${v/max*100}%"></div></div><strong>${money(v)}</strong></div>`).join('')}</div><div class="card"><span class="model-name">Recent shifts</span>${hist.slice(0,10).length?hist.slice(0,10).map(h=>`<div class="bar-row"><span>${h.date}</span><div class="bar"><div style="width:${Math.min(100,h.total/Math.max(1,...hist.slice(0,10).map(x=>x.total))*100)}%"></div></div><strong>${money(h.total)}</strong></div>`).join(''):'<div class="empty">No saved shifts yet</div>'}</div>`}
function renderHistory(){const el=document.getElementById('history-list');el.innerHTML=state.history.length?state.history.map(h=>`<div class="history-item"><strong>${h.date}</strong><span class="hide-mobile">${h.time}</span><span>${money(h.total)} · ${h.sales||0} sales</span><span><button class="btn small" onclick="viewHistory(${h.id})">View</button> <button class="btn small danger" onclick="deleteHistory(${h.id})">Delete</button></span></div>`).join(''):'<div class="empty">No saved shifts yet</div>'}
function viewHistory(id){const h=state.history.find(x=>x.id===id);if(!h)return;document.getElementById('history-detail').value=h.report;document.getElementById('history-modal').classList.add('show')}
function deleteHistory(id){state.history=state.history.filter(x=>x.id!==id);saveState();renderHistory();renderStats()}
function exportBackup(){const blob=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`jucarie-t1-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importBackup(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);state={...structuredClone(defaultState),...(j.state||j)};saveState();location.reload()}catch(e){toast('Invalid backup file')}};r.readAsText(f);ev.target.value=''}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
const commands=[['Go to Calculators',()=>showPage('calc')],['Go to Shift Report',()=>showPage('report')],['Go to Messages',()=>showPage('messages')],['Go to Statistics',()=>showPage('stats')],['Go to History',()=>showPage('history')],['Add message',openMessageEditor],['Set daily goal',openGoalModal],['Generate report',()=>{showPage('report');buildReport(true)}],['Export backup',exportBackup]];
function toggleCommandPalette(){const e=document.getElementById('command-palette');e.classList.toggle('show');if(e.classList.contains('show')){document.getElementById('cmd-search').value='';renderCommands();setTimeout(()=>document.getElementById('cmd-search').focus(),0)}}
function renderCommands(){const q=document.getElementById('cmd-search').value.toLowerCase();document.getElementById('cmd-results').innerHTML=commands.filter(c=>c[0].toLowerCase().includes(q)).map((c,i)=>`<div class="cmd-item" onclick="runCommand('${esc(c[0])}')">${esc(c[0])}</div>`).join('')}
function runCommand(name){const c=commands.find(x=>x[0]===name);document.getElementById('command-palette').classList.remove('show');c?.[1]()}
function shortcuts(e){if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.altKey&&['1','2','3','4','5'].includes(e.key)){e.preventDefault();showPage(['calc','report','messages','stats','history'][+e.key-1]);return}if(e.key.toLowerCase()==='r'&&document.getElementById('page-messages').classList.contains('active')){reroll('mass');reroll('bundle')}}
window.onload=init;
</script></body></html>
