<style>
:root{
  --bg:#050506;
  --panel:#0b0b0e;
  --panel2:#111116;
  --panel3:#08080a;

  --violet:#dc143c;
  --violet2:#ff5a78;
  --cyan:#b1122f;
  --cyan2:#7d0d22;
  --soft:#220b12;
  --green:#d84a65;
  --shadow:0 24px 70px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:
  radial-gradient(circle at 15% -10%,rgba(220,20,60,.16),transparent 28%),
  radial-gradient(circle at 90% 0%,rgba(177,18,47,.08),transparent 24%),
  linear-gradient(180deg,#070708 0%,#030304 100%);
  color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh}
button,input,textarea{font:inherit} button{cursor:pointer}
.os{width:min(1380px,calc(100% - 24px));margin:12px auto 40px}
.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;background:rgba(12,14,28,.9);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:20}
.logo{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#111012;border:1px solid #30242a;border-radius:12px}
.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#ff315b,#8f102a);box-shadow:0 0 24px rgba(220,20,60,.28)}
.logo strong{font-size:.86rem;letter-spacing:.08em} .logo small{display:block;color:var(--muted);font-size:.62rem;margin-top:2px}
.nav{display:flex;justify-content:center;gap:6px}
.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 16px;border-radius:10px;font-weight:800;font-size:.8rem}
.nav button:hover{background:#111012;color:#fff;border-color:#30242a}
.nav button.active{background:linear-gradient(180deg,#251016,#180b0f);color:#fff;border-color:#5b1b2a;box-shadow:inset 0 -2px 0 var(--violet)}
.total-chip{min-width:150px;padding:8px 12px;border-radius:12px;background:#0a090b;border:1px solid #3a1c24;text-align:right}
.total-chip span{display:block;color:#c07a89;font-size:.61rem;text-transform:uppercase;letter-spacing:.14em}
.total-chip strong{font-family:'IBM Plex Mono';font-size:1.05rem;color:var(--cyan)}
.main{padding:22px 2px 10px}
.page{display:none} .page.active{display:block}
.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;padding:12px 4px 20px}
.kicker{font-family:'IBM Plex Mono';color:var(--violet2);font-size:.67rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
h1{margin:0;font-size:clamp(2rem,4vw,3.3rem);letter-spacing:-.055em;line-height:.98}
.sub{color:var(--muted);font-size:.86rem;margin-top:8px}
.mobile-total{display:none;font-family:'IBM Plex Mono';color:var(--cyan)}

/* calculator = ledger */
.ledger{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.goal-panel{position:sticky;top:94px;background:linear-gradient(180deg,#141012,#0c0f1d);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.goal-panel .goal-number{font-family:'IBM Plex Mono';font-size:1.25rem;font-weight:600}
.goal-panel .goal-meta{color:var(--muted);font-size:.75rem;margin-top:5px}
.progress{height:8px;border-radius:999px;background:#060607;border:1px solid #261c20;overflow:hidden;margin:16px 0}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:.22s}
.goal-panel .btn{width:100%}
.models{display:grid;gap:10px}
.model-card{display:grid;grid-template-columns:190px minmax(0,1fr);background:#0b0b0e;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.model-top{padding:17px 16px;background:linear-gradient(180deg,#120d0f,#0d0a0b);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.model-top strong{font-size:.86rem} .model-total{font-family:'IBM Plex Mono';font-size:1.05rem;color:var(--cyan)}
.model-body{display:grid;grid-template-columns:1.25fr .75fr;gap:10px;padding:12px}
.field label{display:block;color:#7e7478;font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;margin:0 0 6px 2px;font-weight:800}
.input{width:100%;background:#070708;border:1px solid #2c2025;border-radius:10px;color:#f4f1f2;padding:10px 11px;outline:none}
.input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,92,255,.1)}
textarea.input{resize:vertical;min-height:100px} .mono{font-family:'IBM Plex Mono';font-size:.75rem;line-height:1.5}
.btn{border:1px solid #352a2f;background:#14182c;color:#f3eff0;padding:10px 13px;border-radius:10px;font-weight:800}
.btn:hover{border-color:#6b3541;background:#181d34}
.btn.primary{background:linear-gradient(135deg,var(--violet),#6546e8);border-color:#8e76ff;color:white}
.btn.small{padding:8px 10px;font-size:.74rem}

/* report = terminal */
.report-console{background:#050506;border:1px solid #2d2327;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.console-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#120d0f;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px} .dots i{width:8px;height:8px;border-radius:50%;background:#554b4f} .dots i:nth-child(1){background:#dc143c} .dots i:nth-child(2){background:#b1122f}
.console-title{font-family:'IBM Plex Mono';font-size:.66rem;color:#968b8f;letter-spacing:.12em}
.report-grid{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:520px}
.report-form{padding:18px;border-right:1px solid var(--line);display:grid;align-content:start;gap:14px;background:#09090b}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px} .shift-row{display:flex;gap:7px} .shift-row .input{flex:1}
.generate-row{display:flex;justify-content:center;margin-top:4px} .generate-row .btn{width:100%}
.report-paper{padding:0;background:#040405;display:flex;flex-direction:column}
.paper-head{padding:12px 14px;border-bottom:1px dashed #252b44;font-family:'IBM Plex Mono';font-size:.66rem;color:#756b6f;letter-spacing:.12em}
.report-paper textarea{flex:1;min-height:440px;width:100%;border:0;outline:0;resize:none;background:transparent;color:#d3cbce;padding:18px;font-family:'IBM Plex Mono';font-size:.76rem;line-height:1.65}

/* messages = board */
.message-shell{--model:var(--violet);--model-soft:#220b12;--model-text:#ffd7df}
.model-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.model-tabs button{border:1px solid #2d2327;background:#0b0b0e;color:#887d81;padding:12px;border-radius:12px;font-weight:900}
.model-tabs button.active{background:var(--model-soft);color:var(--model-text);border-color:color-mix(in srgb,var(--model) 50%,#2d2327);box-shadow:inset 0 -2px 0 var(--model)}
.message-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.message-column{background:#08080a;border:1px solid color-mix(in srgb,var(--model) 22%,#2d2327);border-radius:18px;padding:14px;min-height:100%}
.message-title{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 10px}
.message-title strong{font-size:.9rem} .count{font-family:'IBM Plex Mono';font-size:.65rem;color:var(--muted);margin-left:6px}
.message-title .btn{color:var(--model-text);border-color:color-mix(in srgb,var(--model) 40%,#2d2327)}
.message-card{position:relative;background:#060607;border:1px solid #2a2024;border-radius:13px;padding:15px 16px 15px 18px;margin-top:9px;overflow:hidden}
.message-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--model),color-mix(in srgb,var(--model) 50%,#000))}
.message-card p{margin:0;color:#ddd7d9;line-height:1.58;font-size:.86rem;white-space:pre-wrap}

.toast{position:fixed;right:18px;bottom:18px;background:#111012;border:1px solid #5a2734;color:#fff;padding:10px 13px;border-radius:10px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s;z-index:40}
.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(3,4,10,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.show{display:flex} .modal-box{width:min(410px,100%);background:#110d0f;border:1px solid #4a1f29;border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

@media(max-width:980px){
  .topbar{grid-template-columns:1fr} .logo{justify-content:center} .nav{overflow-x:auto;justify-content:flex-start}
  .nav button{min-width:130px} .total-chip{display:none}
  .ledger{grid-template-columns:1fr} .goal-panel{position:static}

<div class="os">

      </div>

</div>
        </div>
      </div>
    </section>

    const daisyMassPool = [

	];




const BASE_POOLS={jessie:{bundle:jessieBundlePool,mass:jessieMassPool},curvy:{bundle:curvyBundlePool,mass:curvyMassPool},daisy:{bundle:daisyBundlePool,mass:daisyMassPool}};
const KEY='jucarieT1StateV3';
const defaults={earnings:{},notes:{},inputs:{},shift:{time:SHIFTS[0],date:'',custom:'',fani:''},goal:200,recentShown:{},messageBatches:{},lastPage:'calc',messageTab:'jessie'};
let state=loadState();
let currentMessageTab=state.messageTab||'jessie';
function loadState(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'{}');return {...structuredClone(defaults),...raw,shift:{...defaults.shift,...(raw.shift||{})}}}catch{return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(n){return '$'+Number(n||0).toFixed(2)}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function uid(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return 'm'+(h>>>0).toString(36)}
function parseTotal(text=''){let total=0;for(const line of text.split('\n')){const vals=(line.match(/\$(\d+(?:\.\d{1,2})?)/g)||[]).map(v=>+v.slice(1));if(vals.length>=2)total+=vals[vals.length-1]}return total}
function totalNet(){return MODELS.reduce((s,n)=>s+(+state.earnings[n]||0),0)}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1400)}
function init(){state.shift.date=today();MODELS.forEach(n=>{state.earnings[n]??=0;state.notes[n]??='';state.inputs[n]??=''});renderModels();hydrateShift();bind();showPage(['calc','report','messages'].includes(state.lastPage)?state.lastPage:'calc');renderMessages();updateTotals();save()}
function bind(){document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));document.querySelectorAll('.model-tabs button').forEach(b=>b.addEventListener('click',()=>{currentMessageTab=b.dataset.model;state.messageTab=currentMessageTab;save();renderMessages()}));['shift-time','shift-date','shift-custom','shift-fani'].forEach(id=>document.getElementById(id).addEventListener('input',saveShift))}
function showPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+page));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  if(page==='report'){
    const current=today();
    const dateInput=document.getElementById('shift-date');
    if(dateInput){
      dateInput.value=current;
      state.shift.date=current;
    }
  }
  state.lastPage=page;
  save();
}
function renderModels(){const box=document.getElementById('model-list');box.innerHTML='';MODELS.forEach(name=>{const id=name.replace(/\s/g,'');const card=document.createElement('article');card.className='model-card';card.innerHTML=`<div class="model-top"><strong>${esc(name)}</strong><span class="model-total" id="val-${id}">${money(state.earnings[name])}</span></div><div class="model-body"><div class="field"><label>Statement</label><textarea id="input-${id}" class="input mono" rows="5"></textarea></div><div class="field"><label>Notes</label><textarea id="notes-${id}" class="input" rows="5"></textarea></div></div>`;box.appendChild(card);const inp=card.querySelector('#input-'+id),notes=card.querySelector('#notes-'+id);inp.value=state.inputs[name];notes.value=state.notes[name];inp.addEventListener('input',()=>{state.inputs[name]=inp.value;state.earnings[name]=parseTotal(inp.value);card.querySelector('#val-'+id).textContent=money(state.earnings[name]);save();updateTotals()});notes.addEventListener('input',()=>{state.notes[name]=notes.value;save()})})}
function updateTotals(){const total=totalNet();document.getElementById('grand-total').textContent=money(total);document.getElementById('mobile-total').textContent=money(total);const goal=Number(state.goal||0),pct=goal?Math.min(100,total/goal*100):0;document.getElementById('goal-label').textContent=money(goal)+' goal';document.getElementById('goal-progress-text').textContent=`${money(total)} of ${money(goal)} · ${Math.round(pct)}%`;document.getElementById('goal-progress').style.width=pct+'%'}
function openGoal(){document.getElementById('goal-input').value=state.goal||0;document.getElementById('goal-modal').classList.add('show')}
function closeGoal(){document.getElementById('goal-modal').classList.remove('show')}
function saveGoal(){state.goal=Math.max(0,Number(document.getElementById('goal-input').value)||0);save();updateTotals();closeGoal();toast('Goal saved')}
function hydrateShift(){document.getElementById('shift-time').value=state.shift.time||SHIFTS[0];document.getElementById('shift-date').value=state.shift.date||today();document.getElementById('shift-custom').value=state.shift.custom||'';document.getElementById('shift-fani').value=state.shift.fani||''}
function saveShift(){state.shift={time:document.getElementById('shift-time').value,date:document.getElementById('shift-date').value,custom:document.getElementById('shift-custom').value,fani:document.getElementById('shift-fani').value};save()}
function cycleShift(){const now=document.getElementById('shift-time').value;const i=SHIFTS.indexOf(now);document.getElementById('shift-time').value=SHIFTS[(i+1+SHIFTS.length)%SHIFTS.length];saveShift()}
function buildReport(){saveShift();let r='',grand=0;MODELS.forEach((n,i)=>{grand+=+state.earnings[n]||0;r+=`Model ${i+1}: ${n}\n`;if((state.notes[n]||'').trim())r+=state.notes[n].trim()+'\n';r+='---\n'});let date=state.shift.date||'';if(date){const[y,m,d]=date.split('-');date=`${d}/${m}/${y}`}r+=`Data: ${date}\nTura: ${state.shift.time}\nTotal net: ${money(grand)}\nCustom / VC: ${state.shift.custom}\nFani prioritari:\n${state.shift.fani}`;document.getElementById('output-report').value=r;toast('Report generated')}
function messagesFor(type){return (BASE_POOLS[currentMessageTab]?.[type]||[]).map(text=>({id:uid(currentMessageTab+type+text),text}))}
function renderMessages(){const themes={jessie:{model:'#e11d48',soft:'#2b0c16',text:'#ffd7e0'},curvy:{model:'#b91c3c',soft:'#250b13',text:'#f6c7d2'},daisy:{model:'#881337',soft:'#210a13',text:'#edc2cf'}};const th=themes[currentMessageTab]||themes.jessie;const page=document.getElementById('page-messages');page.style.setProperty('--model',th.model);page.style.setProperty('--model-soft',th.soft);page.style.setProperty('--model-text',th.text);document.querySelectorAll('.model-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.model===currentMessageTab));document.getElementById('message-content').innerHTML=['bundle','mass'].map(type=>renderGroup(type)).join('')}
function getBatch(type,msgs){const key=currentMessageTab+':'+type;state.messageBatches??={};state.recentShown??={};const map=new Map(msgs.map(m=>[m.id,m]));let ids=(state.messageBatches[key]||[]).filter(id=>map.has(id));const need=Math.min(3,msgs.length);if(ids.length<need){let recent=new Set(state.recentShown[key]||[]);let avail=msgs.filter(m=>!ids.includes(m.id)&&!recent.has(m.id));if(avail.length<need-ids.length)avail=msgs.filter(m=>!ids.includes(m.id));avail.sort(()=>Math.random()-.5);ids=ids.concat(avail.slice(0,need-ids.length).map(m=>m.id))}const picks=ids.map(id=>map.get(id)).filter(Boolean).slice(0,need);state.messageBatches[key]=picks.map(m=>m.id);save();return picks}
function renderGroup(type){const msgs=messagesFor(type),picks=getBatch(type,msgs),title=type==='bundle'?'Bundles':'Mass Messages';return `<section class="message-column"><div class="message-title"><div><strong>${title}</strong><span class="count">${msgs.length}</span></div><button class="btn small" onclick="reroll('${type}')">Reroll 3</button></div><div id="${type}-list">${picks.map(messageCard).join('')||'<div class="subtitle">No messages yet.</div>'}</div></section>`}
function messageCard(m){return `<article class="message-card" onclick="copyMessageText(this)" title="Click to copy"><p>${esc(m.text)}</p></article>`}
function copyMessageText(card){
  const text=card.querySelector('p')?.textContent||'';
  if(!text)return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Message copied')).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';
  ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');toast('Message copied')}catch{}
  ta.remove();
}
function reroll(type){const msgs=messagesFor(type),key=currentMessageTab+':'+type;let recent=new Set(state.recentShown[key]||[]),avail=msgs.filter(m=>!recent.has(m.id));if(avail.length<Math.min(3,msgs.length)){recent=new Set();state.recentShown[key]=[];avail=[...msgs]}avail.sort(()=>Math.random()-.5);const picks=avail.slice(0,3);state.messageBatches[key]=picks.map(m=>m.id);state.recentShown[key]=[...(state.recentShown[key]||[]),...picks.map(m=>m.id)].slice(-Math.max(20,msgs.length));save();document.getElementById(type+'-list').innerHTML=picks.map(messageCard).join('')}

function copyReport(){
  const text=document.getElementById('output-report')?.value||'';
  if(!text){toast('Generate report first');return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Report copied')).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}


function clearCalculator(){
  if(!confirm('Clear all calculator statements and notes?')) return;

  const main=document.querySelector('.calculator-main');
  const cards=[...document.querySelectorAll('.model-card')];
  main?.classList.add('clearing');

  cards.forEach((card,i)=>{
    card.style.setProperty('--clear-delay',`${i*45}ms`);
    card.classList.add('clear-out');
  });

  setTimeout(()=>{
    MODELS.forEach(name=>{
      state.inputs[name]='';
      state.notes[name]='';
      state.earnings[name]=0;
    });
    save();
    renderModels();
    updateTotals();

    const newCards=[...document.querySelectorAll('.model-card')];
    newCards.forEach((card,i)=>{
      card.style.setProperty('--clear-delay',`${i*45}ms`);
      card.classList.add('clear-in');
    });

    main?.classList.remove('clearing');
    toast('Calculator cleared');

    setTimeout(()=>{
      newCards.forEach(card=>card.classList.remove('clear-in'));
    },700);
  },420);
}

window.addEventListener('load',init);

</script>
</body>
</html>
